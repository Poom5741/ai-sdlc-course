<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Bucket Algorithm</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      h1 {
        color: #4f2bdf;
        font-size: 1.5rem;
        margin-bottom: 0.3rem;
      }
      .sub {
        color: #888;
        font-size: 0.85rem;
        margin-bottom: 1.2rem;
      }
      .bucket-scene {
        width: 100%;
        max-width: 500px;
        display: flex;
        gap: 2rem;
        justify-content: center;
        align-items: flex-end;
      }
      .bucket-wrap {
        text-align: center;
      }
      .bucket-label {
        font-size: 0.8rem;
        color: #888;
        margin-bottom: 0.5rem;
      }
      .bucket {
        width: 140px;
        height: 200px;
        border: 3px solid #4f2bdf;
        border-top: none;
        border-radius: 0 0 16px 16px;
        position: relative;
        overflow: hidden;
        background: #16213e;
      }
      .bucket::before {
        content: "";
        position: absolute;
        top: -3px;
        left: -20px;
        right: -20px;
        height: 3px;
        background: #4f2bdf;
        border-radius: 3px;
      }
      .bucket-inner {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(0deg, #4f2bdf, #6c47ff);
        transition: height 0.3s;
        border-radius: 0 0 13px 13px;
      }
      .token-count {
        font-size: 2rem;
        font-weight: 700;
        color: #4f2bdf;
        margin-top: 0.5rem;
      }
      .request-pipe {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: center;
      }
      .pipe {
        width: 60px;
        height: 40px;
        background: #16213e;
        border: 2px solid #333;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        transition: all 0.3s;
        cursor: pointer;
      }
      .pipe:hover {
        border-color: #4f2bdf;
        transform: scale(1.05);
      }
      .pipe.sent {
        border-color: #00c864;
        box-shadow: 0 0 12px rgba(0, 200, 100, 0.4);
      }
      .pipe.rejected {
        border-color: #e8433e;
        box-shadow: 0 0 12px rgba(232, 67, 62, 0.4);
      }
      .pipe-label {
        font-size: 0.7rem;
        color: #888;
      }
      .log {
        width: 100%;
        max-width: 500px;
        margin-top: 1.2rem;
        background: #16213e;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 0.8rem;
        max-height: 120px;
        overflow-y: auto;
        font-size: 0.75rem;
        font-family: monospace;
      }
      .log-entry {
        padding: 0.15rem 0;
        border-bottom: 1px solid #222;
      }
      .log-entry .time {
        color: #666;
      }
      .log-entry .ok {
        color: #00c864;
      }
      .log-entry .fail {
        color: #e8433e;
      }
      .controls {
        margin-top: 1rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }
      .speed-ctrl {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #16213e;
        padding: 0.5rem 1rem;
        border-radius: 8px;
      }
      .speed-ctrl label {
        font-size: 0.8rem;
        color: #888;
      }
      .speed-ctrl input[type="range"] {
        width: 120px;
        accent-color: #4f2bdf;
      }
      button {
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85rem;
        background: #4f2bdf;
        color: #fff;
        transition: all 0.2s;
      }
      button:hover {
        background: #6c47ff;
      }
      .btn-rst {
        background: #333;
        color: #ccc;
      }
      .btn-rst:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <h1>🪣 Token Bucket Algorithm</h1>
    <p class="sub">Tokens refill over time — requests consume them</p>
    <div class="bucket-scene">
      <div class="request-pipe">
        <div
          class="pipe"
          id="reqBtn"
          onclick="sendRequest()"
          title="Click to send request"
        >
          📨
        </div>
        <div class="pipe-label">Send Request</div>
      </div>
      <div class="bucket-wrap">
        <div class="bucket-label">Token Bucket</div>
        <div class="bucket">
          <div class="bucket-inner" id="water" style="height: 100%"></div>
        </div>
        <div class="token-count"><span id="tokens">10</span> / 10</div>
      </div>
    </div>
    <div class="controls">
      <button onclick="autoSend()">▶ Auto Send</button>
      <button class="btn-rst" onclick="resetBucket()">↺ Reset</button>
      <div class="speed-ctrl">
        <label>Refill speed:</label>
        <input
          type="range"
          id="refillSpeed"
          min="500"
          max="3000"
          value="1500"
          step="100"
        />
      </div>
    </div>
    <div class="log" id="log"></div>
    <script>
      let tokens = 10,
        maxTokens = 10,
        autoTimer = null,
        refillTimer = null;

      function updateVisual() {
        document.getElementById("water").style.height =
          (tokens / maxTokens) * 100 + "%";
        document.getElementById("tokens").textContent = tokens;
      }

      function addLog(ok, msg) {
        const log = document.getElementById("log");
        const d = document.createElement("div");
        d.className = "log-entry";
        const t = document.createElement("span");
        t.className = "time";
        t.textContent = new Date().toLocaleTimeString() + " ";
        const m = document.createElement("span");
        m.className = ok ? "ok" : "fail";
        m.textContent = msg;
        d.appendChild(t);
        d.appendChild(m);
        log.insertBefore(d, log.firstChild);
        if (log.children.length > 30) log.removeChild(log.lastChild);
      }

      function sendRequest() {
        const pipe = document.getElementById("reqBtn");
        if (tokens > 0) {
          tokens--;
          updateVisual();
          pipe.className = "pipe sent";
          addLog(
            true,
            "✅ Request allowed — token consumed. Remaining: " + tokens,
          );
          setTimeout(() => (pipe.className = "pipe"), 400);
        } else {
          pipe.className = "pipe rejected";
          addLog(false, "❌ Request rejected — bucket empty!");
          setTimeout(() => (pipe.className = "pipe"), 400);
        }
      }

      function refill() {
        if (tokens < maxTokens) {
          tokens++;
          updateVisual();
        }
      }

      function autoSend() {
        if (autoTimer) {
          clearInterval(autoTimer);
          autoTimer = null;
          return;
        }
        autoTimer = setInterval(sendRequest, 800);
      }

      function resetBucket() {
        clearInterval(autoTimer);
        autoTimer = null;
        clearInterval(refillTimer);
        tokens = maxTokens;
        updateVisual();
        var l = document.getElementById("log");
        while (l.firstChild) l.removeChild(l.firstChild);
      }

      refillTimer = setInterval(
        refill,
        parseInt(document.getElementById("refillSpeed").value),
      );
      document.getElementById("refillSpeed").oninput = function () {
        clearInterval(refillTimer);
        refillTimer = setInterval(refill, parseInt(this.value));
      };
    </script>
  </body>
</html>
