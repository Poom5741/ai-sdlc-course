<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Counter Visualization</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:system-ui,sans-serif;min-height:100vh;padding:20px}
h1{text-align:center;color:#4f2bdf;margin-bottom:20px;font-size:1.5rem}
.ctn{max-width:700px;margin:0 auto}
.inp{width:100%;min-height:80px;background:#16213e;border:2px solid #4f2bdf;border-radius:10px;padding:12px;color:#e0e0e0;font-size:.9rem;resize:vertical;font-family:inherit}
.inp:focus{outline:none;border-color:#00c864}
.info{display:flex;justify-content:space-between;margin:12px 0;font-size:.85rem;color:#aaa}
.info span{color:#00c864;font-weight:bold;font-size:1.1rem}
.chart{background:#16213e;border-radius:12px;padding:20px;margin-top:16px}
.bar-row{display:flex;align-items:center;margin:8px 0;gap:10px}
.bar-label{width:120px;text-align:right;font-size:.75rem;color:#aaa;flex-shrink:0}
.bar-track{flex:1;height:28px;background:#1a1a2e;border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding:0 8px;font-size:.75rem;font-weight:bold;color:#fff;min-width:0;width:0}
.bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;color:#ccc}
预设{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.pre{padding:6px 12px;border-radius:16px;background:#1a1a2e;border:1px solid #333;color:#ccc;font-size:.75rem;cursor:pointer;transition:all .3s}
.pre:hover{border-color:#4f2bdf;color:#fff}
.legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:.75rem;color:#888}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<h1>🔢 Token Counter Visualization</h1>
<div class="ctn">
<textarea class="inp" id="txt" placeholder="Type or paste text here to count tokens...">The quick brown fox jumps over the lazy dog. This is a simple sentence used to demonstrate tokenization in language models.</textarea>
<div class="info">
<div>Tokens: <span id="tc">0</span></div>
<div>Characters: <span id="cc">0</span></div>
<div>Words: <span id="wc">0</span></div>
</div>
<div class="chart">
<div class="bar-row"><div class="bar-label">Tokens</div><div class="bar-track"><div class="bar-fill" id="b-tok" style="background:#4f2bdf"></div><div class="bar-val" id="v-tok"></div></div></div>
<div class="bar-row"><div class="bar-label">Characters</div><div class="bar-track"><div class="bar-fill" id="b-char" style="background:#00c864"></div><div class="bar-val" id="v-char"></div></div></div>
<div class="bar-row"><div class="bar-label">Words</div><div class="bar-track"><div class="bar-fill" id="b-word" style="background:#e74c3c"></div><div class="bar-val" id="v-word"></div></div></div>
<div class="legend">
<span><span class="dot" style="background:#4f2bdf"></span>Tokens</span>
<span><span class="dot" style="background:#00c864"></span>Characters</span>
<span><span class="dot" style="background:#e74c3c"></span>Words</span>
</div>
</div>
<div class="预设" id="presets"></div>
</div>
<script>
const presets=[
{label:"Short prompt",text:"Hello world"},
{label:"Code comment",text:"// TODO: optimize this query for large datasets and add caching layer"},
{label:"Paragraph",text:"The transformer architecture revolutionized natural language processing by introducing self-attention mechanisms that allow models to weigh the importance of different parts of the input when producing each part of the output."},
{label:"API call prompt",text:"Write a Python function that takes a list of integers and returns the top 3 most frequent numbers. Handle edge cases like empty lists and ties."},
{label:"System prompt",text:"You are a senior software engineer. Always write clean, well-documented code following best practices. Include error handling and type hints."}
];
const pc=document.getElementById('presets');
presets.forEach(p=>{const s=document.createElement('span');s.className='pre';s.textContent=p.label;s.onclick=()=>{document.getElementById('txt').value=p.text;update()};pc.appendChild(s)});
function estimateTokens(t){if(!t)return 0;const w=t.split(/\s+/).filter(Boolean).length;const c=t.length;return Math.max(1,Math.round(w*1.3+c/4))}
function update(){
const t=document.getElementById('txt').value;
const tokens=estimateTokens(t),chars=t.length,words=t.split(/\s+/).filter(Boolean).length;
document.getElementById('tc').textContent=tokens;
document.getElementById('cc').textContent=chars;
document.getElementById('wc').textContent=words;
const mx=Math.max(tokens,chars/4,words*1.5,1);
setTimeout(()=>{document.getElementById('b-tok').style.width=(tokens/mx*100)+'%';document.getElementById('b-char').style.width=(chars/4/mx*100)+'%';document.getElementById('b-word').style.width=(words*1.5/mx*100)+'%';document.getElementById('v-tok').textContent=tokens;document.getElementById('v-char').textContent=chars;document.getElementById('v-word').textContent=words},50);
}
document.getElementById('txt').addEventListener('input',update);
update();
</script>
</body></html>
