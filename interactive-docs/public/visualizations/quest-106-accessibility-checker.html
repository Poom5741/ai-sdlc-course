<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessibility Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px}
h1{text-align:center;color:#4f2bdf;font-size:1.8rem;margin-bottom:8px}
.subtitle{text-align:center;color:#888;margin-bottom:24px;font-size:.9rem}
.container{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.container{grid-template-columns:1fr}}
.code-panel{background:#0d1117;border-radius:12px;overflow:hidden;font-family:'Fira Code',monospace;font-size:.8rem}
.code-header{background:#161b22;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #21262d}
.code-header span{color:#8b949e;font-size:.78rem}
.code-body{padding:16px;overflow-x:auto;max-height:500px;overflow-y:auto;line-height:1.8;counter-reset:line}
.code-line{display:flex;position:relative;padding:2px 8px;border-radius:4px;transition:background .3s}
.code-line:hover{background:#1c2333}
.code-line.violation{background:#2d0a0e;border-left:3px solid #ff4757}
.code-line.warning{background:#2d2006;border-left:3px solid #f5a623}
.code-line.pass{border-left:3px solid #00c864}
.line-num{color:#484f58;min-width:30px;text-align:right;margin-right:16px;user-select:none}
.line-code{color:#c9d1d9;white-space:pre}
.highlight-tag{background:#4f2bdf44;color:#a78bfa;padding:0 3px;border-radius:3px}
.highlight-attr{background:#ff475744;color:#ff6b7a;padding:0 3px;border-radius:3px}
.highlight-img{background:#f5a62344;color:#f5c542;padding:0 3px;border-radius:3px}
.issues-panel{display:flex;flex-direction:column;gap:12px}
.issue-card{background:#16213e;border-radius:12px;padding:16px;cursor:pointer;transition:all .3s;border-left:4px solid #ff4757}
.issue-card:hover{transform:translateX(4px)}
.issue-card.resolved{border-left-color:#00c864;opacity:.6}
.issue-card.selected{border:1px solid #4f2bdf;box-shadow:0 0 15px rgba(79,43,223,.2)}
.severity{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;margin-bottom:6px}
.severity.critical{background:#ff475733;color:#ff4757}
.severity.major{background:#f5a62333;color:#f5a623}
.severity.minor{background:#4f2bdf33;color:#4f2bdf}
.issue-title{font-size:.88rem;font-weight:600;margin-bottom:4px}
.issue-wcag{font-size:.72rem;color:#666;margin-bottom:6px}
.issue-desc{font-size:.8rem;color:#aaa;line-height:1.5}
.fix-suggestion{background:#0d2818;border-radius:8px;padding:10px;margin-top:8px;font-size:.78rem;color:#00c864;display:none}
.issue-card.selected .fix-suggestion{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.score-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;max-width:1100px;margin:0 auto 20px}
.score-ring{width:80px;height:80px}
.score-label{font-size:.85rem;color:#aaa}
.score-value{font-size:2rem;font-weight:700}
.controls{max-width:1100px;margin:0 auto 16px;display:flex;gap:10px;justify-content:center}
.controls button{background:#4f2bdf;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:background .2s}
.controls button:hover{background:#6b45e0}
.controls button.secondary{background:#16213e;border:1px solid #4f2bdf}
</style>
</head>
<body>
<h1>♿ Accessibility Scanner</h1>
<p class="subtitle">Click issues to see fixes. Lines with violations are highlighted in the code panel.</p>
<div class="controls">
<button onclick="runScan()">▶ Run Scan</button>
<button class="secondary" onclick="resolveAll()">✓ Resolve All</button>
<button class="secondary" onclick="resetScan()">↻ Reset</button>
</div>
<div class="score-bar">
<svg class="score-ring" viewBox="0 0 80 80">
<circle cx="40" cy="40" r="34" fill="none" stroke="#0d1b3e" stroke-width="8"/>
<circle id="scoreArc" cx="40" cy="40" r="34" fill="none" stroke="#ff4757" stroke-width="8" stroke-dasharray="0 214" stroke-linecap="round" transform="rotate(-90 40 40)" style="transition:stroke-dasharray 1.5s,stroke 1s"/>
<text x="40" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" id="scoreText">0</text>
</svg>
<div>
<div class="score-label">Accessibility Score</div>
<div style="font-size:.8rem;color:#666" id="scoreBreakdown">0 critical · 0 major · 0 minor</div>
</div>
</div>
<div class="container">
<div class="code-panel">
<div class="code-header"><span>index.html</span><span id="scanStatus">Ready to scan</span></div>
<div class="code-body" id="codeBody"></div>
</div>
<div class="issues-panel" id="issuesPanel"></div>
</div>

<script>
const codeLines=[
{code:'<span class="highlight-tag">&lt;html&gt;</span>',type:'pass'},
{code:'<span class="highlight-tag">&lt;head&gt;</span>',type:'pass'},
{code:'  <span class="highlight-tag">&lt;title&gt;</span>My App<span class="highlight-tag">&lt;/title&gt;</span>',type:'pass'},
{code:'<span class="highlight-tag">&lt;/head&gt;</span>',type:'pass'},
{code:'<span class="highlight-tag">&lt;body&gt;</span>',type:'pass'},
{code:'  <span class="highlight-tag">&lt;div</span> <span class="highlight-attr">class="header"</span><span class="highlight-tag">&gt;</span>',type:'violation',issue:'div-header'},
{code:'    <span class="highlight-tag">&lt;img</span> <span class="highlight-img">src="logo.png"</span><span class="highlight-tag"> /&gt;</span>',type:'violation',issue:'img-alt'},
{code:'    <span class="highlight-tag">&lt;h1&gt;</span>Welcome<span class="highlight-tag">&lt;/h1&gt;</span>',type:'pass'},
{code:'    <span class="highlight-tag">&lt;div</span> <span class="highlight-attr">onclick="openMenu()"</span><span class="highlight-tag">&gt;</span>Menu<span class="highlight-tag">&lt;/div&gt;</span>',type:'violation',issue:'click-div'},
{code:'  <span class="highlight-tag">&lt;/div&gt;</span>',type:'pass'},
{code:'  <span class="highlight-tag">&lt;form&gt;</span>',type:'pass'},
{code:'    <span class="highlight-tag">&lt;input</span> <span class="highlight-attr">type="email"</span><span class="highlight-tag"> /&gt;</span>',type:'violation',issue:'input-label'},
{code:'    <span class="highlight-tag">&lt;input</span> <span class="highlight-attr">type="password"</span><span class="highlight-tag"> /&gt;</span>',type:'violation',issue:'input-label'},
{code:'    <span class="highlight-tag">&lt;button</span> <span class="highlight-attr">style="color:#888"</span><span class="highlight-tag">&gt;</span>Submit<span class="highlight-tag">&lt;/button&gt;</span>',type:'warning',issue:'color-contrast'},
{code:'  <span class="highlight-tag">&lt;/form&gt;</span>',type:'pass'},
{code:'  <span class="highlight-tag">&lt;p</span> <span class="highlight-attr">tabindex="5"</span><span class="highlight-tag">&gt;</span>Read me<span class="highlight-tag">&lt;/p&gt;</span>',type:'warning',issue:'tabindex'},
{code:'  <span class="highlight-tag">&lt;div</span> <span class="highlight-attr">role="button"</span><span class="highlight-tag">&gt;</span>Click here<span class="highlight-tag">&lt;/div&gt;</span>',type:'violation',issue:'role-button'},
{code:'  <span class="highlight-tag">&lt;video</span> <span class="highlight-img">src="demo.mp4"</span><span class="highlight-tag">&gt;&lt;/video&gt;</span>',type:'violation',issue:'video-caption'},
{code:'<span class="highlight-tag">&lt;/body&gt;</span>',type:'pass'},
];

const issues=[
{id:'div-header',title:'Non-semantic header element',severity:'critical',wcag:'WCAG 1.3.1 (Level A)',desc:'Use <header> instead of <div> for page header. Screen readers need semantic landmarks to navigate efficiently.',fix:'Replace <div class="header"> with <header> element. Semantic HTML provides built-in ARIA roles.',line:6},
{id:'img-alt',title:'Image missing alt attribute',severity:'critical',wcag:'WCAG 1.1.1 (Level A)',desc:'All <img> elements must have an alt attribute. Images without alt are announced as "image" with no description.',fix:'<img src="logo.png" alt="Company Logo — Click to return home">',line:7},
{id:'click-div',title:'Non-interactive element with click handler',severity:'critical',wcag:'WCAG 4.1.2 (Level A)',desc:'Divs are not keyboard accessible by default. Click handlers on non-interactive elements exclude keyboard users.',fix:'Use <button> or add tabindex="0" + role="button" + keydown handler for Enter/Space.',line:9},
{id:'input-label',title:'Form input missing label',severity:'critical',wcag:'WCAG 1.3.1 (Level A)',desc:'Inputs without associated labels are inaccessible. Screen readers cannot announce the purpose of the field.',fix:'<label for="email">Email</label> <input id="email" type="email">',line:12},
{id:'color-contrast',title:'Insufficient color contrast',severity:'major',wcag:'WCAG 1.4.3 (Level AA)',desc:'Text color #888 on dark background has contrast ratio ~3.5:1. Minimum required is 4.5:1 for normal text.',fix:'Use a lighter color like #b0b0b0 or #c0c0c0 to meet 4.5:1 ratio. Test with WebAIM Contrast Checker.',line:14},
{id:'tabindex',title:'Positive tabindex value',severity:'major',wcag:'WCAG 2.4.3 (Level A)',desc:'tabindex="5" creates an unpredictable tab order. Use tabindex="0" to add to natural flow or "−1" for programmatic focus.',fix:'Change tabindex="5" to tabindex="0", or better yet, rely on natural document order for tab flow.',line:16},
{id:'role-button',title:'Div with role="button" missing keyboard support',severity:'critical',wcag:'WCAG 4.1.2 (Level A)',desc:'role="button" alone doesn\'t make a div keyboard accessible. Must add tabindex and keyboard event handlers.',fix:'<button>Click here</button> is preferred. If custom: add tabindex="0" + onkeydown="if(event.keyEnter)click()"',line:18},
{id:'video-caption',title:'Video missing captions/subtitles',severity:'critical',wcag:'WCAG 1.2.2 (Level A)',desc:'Video content must have captions for deaf/hard-of-hearing users. Pre-recorded video requires synchronized captions.',fix:'<video src="demo.mp4" controls><track kind="captions" src="demo.vtt" srclang="en" default></video>',line:19},
];

let selectedIssue=null;

function renderCode(){
const body=document.getElementById('codeBody');
body.innerHTML=codeLines.map((l,i)=>{
const cls=l.type==='violation'?'violation':l.type==='warning'?'warning':'pass';
return`<div class="code-line ${cls}" ${l.issue?`onclick="selectIssue('${l.issue}')"`:''}"><span class="line-num">${i+1}</span><span class="line-code">${l.code}</span></div>`;
}).join('');
}

function renderIssues(){
const panel=document.getElementById('issuesPanel');
panel.innerHTML=issues.map(is=>`
<div class="issue-card ${is.resolved?'resolved':''} ${selectedIssue===is.id?'selected':''}" id="issue-${is.id}" onclick="selectIssue('${is.id}')">
<span class="severity ${is.severity}">${is.severity.toUpperCase()}</span>
<div class="issue-title">${is.title}</div>
<div class="issue-wcag">${is.wcag} · Line ${is.line}</div>
<div class="issue-desc">${is.desc}</div>
<div class="fix-suggestion">🔧 <strong>Fix:</strong> ${is.fix}
<br><br><button onclick="event.stopPropagation();resolveIssue('${is.id}')" style="background:#00c864;color:#fff;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.75rem">Mark Resolved</button>
</div>
</div>`).join('');
updateScore();
}

function selectIssue(id){
selectedIssue=selectedIssue===id?null:id;
renderIssues();
if(selectedIssue){
const el=document.getElementById('issue-'+id);
if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
const issue=issues.find(i=>i.id===id);
if(issue){
const line=codeLines[issue.line-1];
const codeLine=document.querySelectorAll('.code-line')[issue.line-1];
if(codeLine){codeLine.style.background='#4f2bdf33';codeLine.style.borderLeftColor='#4f2bdf'}
}
}
}

function resolveIssue(id){
const issue=issues.find(i=>i.id===id);
if(issue){issue.resolved=true;
const line=codeLines[issue.line-1];
if(line)line.type='pass';
renderCode();renderIssues();}
}

function resolveAll(){issues.forEach(i=>{i.resolved=true;codeLines[i.line-1].type='pass'});renderCode();renderIssues();}

function runScan(){
issues.forEach(i=>i.resolved=false);
codeLines.forEach((l,i)=>{const issue=issues.find(is=>is.line===i+1);if(issue)l.type=issue.severity==='critical'?'violation':'warning'});
renderCode();
document.getElementById('scanStatus').textContent='Scanning...';
let count=0;
const timer=setInterval(()=>{count++;document.getElementById('scanStatus').textContent=`Found ${count}/${issues.length} issues...`;if(count>=issues.length){clearInterval(timer);document.getElementById('scanStatus').textContent=`${issues.length} issues found`;renderIssues();}},200);
}

function resetScan(){
issues.forEach(i=>i.resolved=false);
codeLines.forEach((l,i)=>{const issue=issues.find(is=>is.line===i+1);if(issue){l.type=issue.severity==='critical'?'violation':'warning'}else{l.type='pass'}});
selectedIssue=null;
document.getElementById('scanStatus').textContent='Ready to scan';
renderCode();renderIssues();
}

function updateScore(){
const crit=issues.filter(i=>i.severity==='critical'&&!i.resolved).length;
const maj=issues.filter(i=>i.severity==='major'&&!i.resolved).length;
const min=issues.filter(i=>i.severity==='minor'&&!i.resolved).length;
const total=issues.length;
const resolved=issues.filter(i=>i.resolved).length;
const score=Math.round((resolved/total)*100);
const arc=document.getElementById('scoreArc');
arc.setAttribute('stroke-dasharray',`${(score/100)*214} 214`);
arc.setAttribute('stroke',score>=80?'#00c864':score>=50?'#f5a623':'#ff4757');
document.getElementById('scoreText').textContent=score;
document.getElementById('scoreBreakdown').textContent=`${crit} critical · ${maj} major · ${min} minor`;
}

renderCode();renderIssues();
</script>
</body>
</html>
